name: Helm chart

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check out polytope-chart
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: polytope-chart
          persist-credentials: false
      - name: Check out pinned BOBS chart source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ecmwf/bobs
          ref: 03583b8e9b9a0eea81d25f39437870f2765e2a5d
          path: bobs
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.20.1
      - name: Verify source and build dependencies
        run: |
          test "$(cat polytope-chart/.bobs-chart-revision)" = "$(git -C bobs rev-parse HEAD)"
          helm dependency update polytope-chart
      - name: Lint and render
        working-directory: polytope-chart
        run: |
          helm lint . --strict
          ./tests/run.sh
