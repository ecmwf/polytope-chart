nameOverride: ""
fullnameOverride: ""

global:
  # Override ALL image registries in the chart (e.g. for air-gapped environments).
  imageRegistry: ""
  # Pull secrets propagated to all pods, including subcharts (bobs, etc.).
  imagePullSecrets: []
  # When set, the chart creates a kubernetes.io/dockerconfigjson Secret and
  # automatically adds it to imagePullSecrets on every pod (including subcharts).
  imageCredentials: {}
    # registry: eccr.ecmwf.int
    # username: robot$polytope+polytope-pull
    # password: changeme
  # ── Ingress controller selection ───────────────────────────────────────────
  # Selects which ingress controller flavour the chart and BOBS subchart
  # should render for. Supported values:
  #   nginx-inc       — NGINX Inc / NGINX Plus controller (ECMWF Bologna).
  #                     Renders mergeable master+minion Ingresses, uses
  #                     `nginx.org/*` annotations, and BOBS rewrites via
  #                     `nginx.org/location-snippets`. Default for backward
  #                     compatibility with the existing Bologna deployment.
  #   nginx-community — Community ingress-nginx (kubernetes/ingress-nginx).
  #                     Renders a single frontend Ingress plus a single BOBS
  #                     Ingress with `nginx.ingress.kubernetes.io/use-regex` +
  #                     `rewrite-target` for `/<routeName>-N/<uuid>` ->
  #                     `/api/v1/read/<uuid>`. Used by DestinE clusters
  #                     (leo, lumi, mn5).
  #
  # IngressClass tip: on clusters with multiple ingress controllers installed,
  # the bare `nginx` className can be ambiguous. Override `ingress.className`
  # (parent) and `bobs.ingress.className` (subchart) per location to the
  # controller-specific class actually registered in that cluster, e.g.
  # `nginx`, `nginx-inc`, or `nginx-external`.
  ingress:
    controller: nginx-inc

# Additional pull secrets for the parent chart only (merged with global).
imagePullSecrets: []

# ── Polytope identity ─────────────────────────────────────────────────────────
# Stable 1-3 character lowercase alphanumeric tags used in persisted request IDs.
# Set explicitly from deployment values; these are not inferred from Kubernetes.
polytope:
  site: ""
  env: ""

# Default pod annotations for log collection. Component-specific annotations are
# merged over these defaults by the templates.
podAnnotations:
  opensearch.org/include: "true"
  opensearch.org/service.name: polytope

# ── Frontend (broker) ─────────────────────────────────────────────────────────
frontend:
  image:
    repository: polytope-server
    tag: "2.0.0"
    pullPolicy: Always
  host: "0.0.0.0"
  port: 3000
  brokerPort: 9001
  internalPollPort: 9002
  replicas: 1
  rustLog: info
  persist_after_secs: 10
  # Retain consumed v1 redirect metadata for repeat status polls.
  completedRedirectTtlSecs: 600
  # max_jobs: 500000              # Broker-wide job limit (OOM protection, default 500000)
  # retry_after_secs: 5           # Retry-After header on 529 overload responses
  # nats_connect_timeout_secs: 10 # NATS persistence connection timeout per attempt
  # nats_init_max_attempts: 6     # NATS init retry attempts (exponential backoff)
  resources: {}
  podAnnotations: {}

# ── Broker ────────────────────────────────────────────────────────────────────
# Targets, routes, checks, and transforms for the bits routing engine.
# persistence and internal_poll_endpoint are injected by the chart.
broker:
  targets:
    worker_pool:
      type: remote
      dispatcher:
        queue: cost_weighted
        # queue_capacity: 500000    # Per-dispatcher queue bound (default 500000)
        executor:
          type: remote_pool
          heartbeat_timeout_secs: 60
  routes:
    - default:
        - target::worker_pool

# ── MCP frontend ──────────────────────────────────────────────────────────────
# Optional Model Context Protocol endpoint mounted at /mcp. Auth is handled by
# the same frontend authentication middleware as the HTTP APIs.
mcp:
  enabled: false
  catalogueUrl: ""
  inlineResultMaxBytes: 65536
  # Leave empty to let the server accept any Host header. Set to the public
  # ingress host(s) for stricter Streamable HTTP host validation.
  allowedHosts: []
  allowedOrigins: []

# ── Schedule ──────────────────────────────────────────────────────────────────
# Schedule XML for the schedule_released check. `enabled` is tri-state during
# migration: true/false are authoritative; omitted or null preserves the legacy
# behaviour where a non-empty schedule map enables the integration.
# schedule:
#   enabled: true
#   repo: "git@github.com:org/repo.git"
#   branch: develop
#   path: share/project/schedule.xml
#   sshSecretName: polytope-schedule-ssh
schedule: {}

# ── Worker defaults ───────────────────────────────────────────────────────────
worker:
  # Long-poll timeout for idle worker→broker /work requests, in milliseconds.
  # Busy brokers return jobs immediately; this timeout is reached only when the
  # selected broker has no work. Lower values improve broker coverage convergence
  # and frontend elasticity because idle workers re-sample another frontend more
  # often, at the cost of more cheap empty 204 polls and TCP connections.
  pollTimeoutMs: 3000
  rustLog: info

# ── Worker pools ──────────────────────────────────────────────────────────────
# Each key produces a Deployment (+ optional ConfigMap when config is set).
# The chart handles mounting and CLI args internally.
# `pool` is the broker target name — workers connect to /pool/work on the broker.
#
# workerPools:
#   fdb-alps:
#     image:
#       repository: fdb-worker
#       tag: "2.0.0"
#     pool: worker_pool
#     replicas: 5
#     rustLog: debug             # optional; overrides worker.rustLog
#     pollTimeoutMs: 3000        # optional per-pool override
#     cache:
#       mountPath: /tmp/cache
#       emptyDir:
#         sizeLimit: 10Gi        # defaults to 10Gi when omitted
#       # hostPath:              # use instead of emptyDir
#       #   path: /var/lib/polytope/cache
#       #   type: DirectoryOrCreate
#     # cacheDir: /tmp/cache     # deprecated legacy hostPath (one release)
#     config:
#       type: remote
#       host: svc001.alpsb.cscs.ch
#       port: 9000
# Override-only fragments must opt in so an absent base pool is not an error:
#   optional-tuning:
#     overrideOnly: true
workerPools: {}

# ── NATS JetStream (persistence backend) ──────────────────────────────────────
# Bundled official NATS subchart. When enabled, the chart deploys a NATS server
# with JetStream and wires it into the bits persistence config automatically.
nats:
  enabled: true
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi
      memoryStore:
        enabled: true
        maxSize: 256Mi

# ── BOBS (temporary spool storage) ────────────────────────────────────────────
# Bundled subchart from ecmwf/bobs. Workers write results here; clients read
# via redirect URLs.
bobs:
  enabled: true
  observability:
    deploymentEnv: "" # standalone override; if empty, inherits from parent
    deploymentEnvConfigMapName: "" # name of the ConfigMap carrying BOBS_DEPLOYMENT_ENV
    deploymentEnvConfigMapKey: BOBS_DEPLOYMENT_ENV
  image:
    repository: eccr.ecmwf.int/bobs/bobs
    tag: "0.1.3"
    digest: ""
    pullPolicy: Always
  persistence:
    enabled: true
    size: 10Gi
  config:
    page_size: 16777216
    max_cache_bytes: 268435456
    metrics:
      enabled: false
      port: 9090
      allowed_labels:
        - collection
      max_label_value_length: 128
      serviceMonitor:
        enabled: false
        interval: 30s
        labels: {}

# ── Authentication (auth-o-tron gateway) ──────────────────────────────────────
# When set, all API endpoints require valid credentials.
# /api/v2/health remains public (used by k8s probes).
# authentication:
#   url: "http://auth-o-tron:8080"
#   secret: ""              # plaintext fallback (prefer secretName)
#   secretName: ""          # K8s Secret holding the JWT signing secret
#   secretKey: auth-secret  # key inside the Secret
#   timeout_ms: 3000

# ── auth-o-tron subchart ──────────────────────────────────────────────────────
# Bundled auth-o-tron gateway (subchart alias "auth-o-tron"). Pin the image tag
# to the released auth-o-tron so enabling the subchart does not deploy the
# subchart's stale default tag. Providers/JWT config are supplied per-deployment.
auth-o-tron:
  enabled: true
  image:
    tag: "0.3.7"

# ── Ingress ───────────────────────────────────────────────────────────────────
# Host is constructed as {{ hostPrefix }}.{{ domain }}.
ingress:
  enabled: false
  className: nginx
  hostPrefix: polytope
  domain: ""
  annotations: {}
  # Broker stickiness. `stickyHashBy` is the portable Authorization-based key
  # used by NGINX Inc and as the community-controller fallback/override.
  # Consistent (ketama) hashing keeps routing stable across broker scaling.
  stickyHashBy: "$http_authorization$proxy_protocol_addr"
  # Community ingress-nginx uses this key by default. Its controller ConfigMap
  # must define `$polytope_frontend_hash_key`, normally with:
  #
  #   map $http_user_agent $polytope_frontend_hash_key {
  #       ~*^eodag  $http_user_agent;
  #       default   $http_authorization;
  #   }
  #
  # Set this to another NGINX complex value, or to "" to fall back to
  # `stickyHashBy`. This setting does not affect NGINX Inc controllers.
  communityStickyHashBy: "$polytope_frontend_hash_key"
  # Set both hash values to "" to disable stickiness (round-robin).
  tls: []

# ── Telemetry (Prometheus metrics scrape) ─────────────────────────────────────
# When enabled, the frontend exposes a /metrics endpoint for Prometheus.
# Requires the polytope-server image to be built with --features telemetry.
telemetry:
  enabled: false
  port: 9090
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  workers:
    enabled: false
    port: 9090
    serviceMonitor:
      enabled: false
      interval: 30s
      labels: {}
