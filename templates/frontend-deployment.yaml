{{- $scheduleEnabled := eq (include "polytope-server.scheduleEnabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "polytope-server.fullname" . }}-frontend
  labels:
    {{- include "polytope-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "polytope-server.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      {{- $podAnnotations := mergeOverwrite (deepCopy (.Values.podAnnotations | default dict)) (.Values.frontend.podAnnotations | default dict) }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with $podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "polytope-server.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
        app: frontend
    spec:
      {{- include "polytope-server.imagePullSecrets" . | nindent 6 }}
      {{- if or .Values.nats.enabled $scheduleEnabled }}
      initContainers:
        {{- if .Values.nats.enabled }}
        # Block until NATS JetStream is actually serving (meta-group leader
        # elected / quorum formed), not merely until the client TCP port is
        # open. The 3-node JetStream cluster has a cold-start window where
        # 4222 accepts connections but JetStream still returns 503
        # ("system temporarily unavailable") while peers join and the meta
        # group elects a leader. The frontend exits immediately on a
        # persistence error, so starting it inside that window makes it create
        # its KV bucket against a not-yet-quorate cluster and then crash when
        # the meta group re-forms. The monitoring /healthz endpoint reports
        # ok only once JetStream has a stable leader, so gate on its body.
        - name: wait-for-nats
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until wget -q -T 3 -O- "http://{{ .Release.Name }}-nats-headless:8222/healthz" 2>/dev/null | grep -q '"status":"ok"'; do
                echo "waiting for nats jetstream to report healthy..."
                sleep 2
              done
        {{- end }}
        {{- if $scheduleEnabled }}
        - name: fetch-schedule
          image: alpine/git:2.47.2
          command:
            - sh
            - -c
            - |
              mkdir -p ~/.ssh
              cp /ssh-key/ssh-privatekey ~/.ssh/id_ed25519
              chmod 600 ~/.ssh/id_ed25519
              printf 'Host github.com\n  HostName ssh.github.com\n  Port 443\n  User git\n' > ~/.ssh/config
              ssh-keyscan -p 443 ssh.github.com >> ~/.ssh/known_hosts 2>/dev/null
              git clone --depth 1 --branch {{ .Values.schedule.branch | default "develop" }} {{ .Values.schedule.repo | quote }} /tmp/repo
              cp /tmp/repo/{{ .Values.schedule.path }} /schedule/schedule.xml
          volumeMounts:
            - name: schedule
              mountPath: /schedule
            - name: schedule-ssh
              mountPath: /ssh-key
              readOnly: true
        {{- end }}
      {{- end }}
      containers:
        - name: polytope-server
          image: {{ include "polytope-server.image" (dict "imageRoot" .Values.frontend.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default "Always" }}
          args:
            - /etc/polytope/config.yaml
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
              protocol: TCP
            - name: broker
              containerPort: {{ .Values.frontend.brokerPort }}
              protocol: TCP
            {{- if .Values.telemetry.enabled }}
            - name: metrics
              containerPort: {{ .Values.telemetry.port }}
              protocol: TCP
            {{- end }}
            - name: internal-poll
              containerPort: {{ .Values.frontend.internalPollPort }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: internal-poll
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v2/health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 5
          env:
            - name: RUST_LOG
              value: {{ .Values.frontend.rustLog | default "info" | quote }}
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POLYTOPE_ENV
              value: {{ .Values.polytope.env | quote }}
            {{- with .Values.authentication }}
            {{- if .secretName }}
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey | default "auth-secret" }}
            {{- end }}
            {{- end }}
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/polytope/config.yaml
              subPath: config.yaml
            {{- if $scheduleEnabled }}
            - name: schedule
              mountPath: /etc/polytope/schedule.xml
              subPath: schedule.xml
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "polytope-server.fullname" . }}-config
        {{- if $scheduleEnabled }}
        - name: schedule
          emptyDir: {}
        - name: schedule-ssh
          secret:
            secretName: {{ .Values.schedule.sshSecretName }}
            defaultMode: 0400
        {{- end }}
