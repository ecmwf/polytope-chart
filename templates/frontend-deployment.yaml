{{- $authotron := index .Values "auth-o-tron" -}}
{{- $authEnabled := or ((.Values.authentication).enabled | default false) ($authotron.enabled | default false) -}}
{{- $publicKeySecret := (.Values.authentication).publicKeySecret | default dict -}}
{{- $jwt := ($authotron.config).jwt | default dict -}}
{{- $issuer := (.Values.authentication).issuer | default $jwt.iss -}}
{{- $audience := (.Values.authentication).audience | default $jwt.aud -}}
{{- $keyId := (.Values.authentication).keyId | default $jwt.kid -}}
{{- $podAnnotations := mergeOverwrite (deepCopy (.Values.podAnnotations | default dict)) (.Values.frontend.podAnnotations | default dict) -}}
{{- if $authEnabled -}}
{{- $issuer = required "authentication issuer is required (authentication.issuer or auth-o-tron.config.jwt.iss)" $issuer -}}
{{- $audience = required "authentication audience is required (authentication.audience or auth-o-tron.config.jwt.aud)" $audience -}}
{{- $keyId = required "authentication key id is required (authentication.keyId or auth-o-tron.config.jwt.kid)" $keyId -}}
{{- $_ := required "authentication.publicKeySecret.name is required" $publicKeySecret.name -}}
{{- $_ := required "authentication.publicKeySecret.key is required" $publicKeySecret.key -}}
{{- include "polytope-server.validateAuthRs256" . -}}
{{- $keyIds := dict -}}
{{- $_ = set $keyIds $keyId true -}}
{{- range $index, $key := (.Values.authentication).additionalPublicKeys -}}
{{- $additionalKeyId := required (printf "authentication.additionalPublicKeys[%d].kid is required" $index) $key.kid -}}
{{- if hasKey $keyIds $additionalKeyId -}}
{{- fail (printf "authentication public key id %q is duplicated" $additionalKeyId) -}}
{{- end -}}
{{- $_ = set $keyIds $additionalKeyId true -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "polytope-server.fullname" . }}-frontend
  labels:
    {{- include "polytope-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "polytope-server.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with $podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "polytope-server.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
        app: frontend
    spec:
      {{- include "polytope-server.imagePullSecrets" . | nindent 6 }}
      {{- if or .Values.nats.enabled .Values.schedule $authEnabled }}
      initContainers:
        {{- if .Values.nats.enabled }}
        # Block until NATS JetStream is actually serving (meta-group leader
        # elected / quorum formed), not merely until the client TCP port is
        # open. The 3-node JetStream cluster has a cold-start window where
        # 4222 accepts connections but JetStream still returns 503
        # ("system temporarily unavailable") while peers join and the meta
        # group elects a leader. The frontend exits immediately on a
        # persistence error, so starting it inside that window makes it create
        # its KV bucket against a not-yet-quorate cluster and then crash when
        # the meta group re-forms. The monitoring /healthz endpoint reports
        # ok only once JetStream has a stable leader, so gate on its body.
        - name: wait-for-nats
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until wget -q -T 3 -O- "http://{{ .Release.Name }}-nats-headless:8222/healthz" 2>/dev/null | grep -q '"status":"ok"'; do
                echo "waiting for nats jetstream to report healthy..."
                sleep 2
              done
        {{- end }}
        {{- if $authEnabled }}
        # Build the runtime-only authentication block from Secret-backed public
        # keys. The source ConfigMap never contains key material.
        - name: build-auth-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              {{ include "polytope-server.authRuntimeConfigScript" . | nindent 14 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: config-runtime
              mountPath: /runtime
            - name: auth-public-keys
              mountPath: /keys
              readOnly: true
        {{- end }}
        {{- if .Values.schedule }}
        - name: fetch-schedule
          image: alpine/git:2.47.2
          command:
            - sh
            - -c
            - |
              mkdir -p ~/.ssh
              cp /ssh-key/ssh-privatekey ~/.ssh/id_ed25519
              chmod 600 ~/.ssh/id_ed25519
              printf 'Host github.com\n  HostName ssh.github.com\n  Port 443\n  User git\n' > ~/.ssh/config
              ssh-keyscan -p 443 ssh.github.com >> ~/.ssh/known_hosts 2>/dev/null
              git clone --depth 1 --branch {{ .Values.schedule.branch | default "develop" }} {{ .Values.schedule.repo | quote }} /tmp/repo
              cp /tmp/repo/{{ .Values.schedule.path }} /schedule/schedule.xml
          volumeMounts:
            - name: schedule
              mountPath: /schedule
            - name: schedule-ssh
              mountPath: /ssh-key
              readOnly: true
        {{- end }}
      {{- end }}
      containers:
        - name: polytope-server
          image: {{ include "polytope-server.image" (dict "imageRoot" .Values.frontend.image "global" .Values.global "chart" .Chart) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default "Always" }}
          args:
            - /etc/polytope/config.yaml
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
              protocol: TCP
            - name: broker
              containerPort: {{ .Values.frontend.brokerPort }}
              protocol: TCP
            {{- if .Values.telemetry.enabled }}
            - name: metrics
              containerPort: {{ .Values.telemetry.port }}
              protocol: TCP
            {{- end }}
            - name: internal-poll
              containerPort: {{ .Values.frontend.internalPollPort }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: internal-poll
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v2/health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 5
          env:
            - name: RUST_LOG
              value: info
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POLYTOPE_ENV
              value: {{ .Values.polytope.env | quote }}
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if $authEnabled }}
            - name: config-runtime
              mountPath: /etc/polytope/config.yaml
              subPath: config.yaml
            {{- else }}
            - name: config
              mountPath: /etc/polytope/config.yaml
              subPath: config.yaml
            {{- end }}
            {{- if .Values.schedule }}
            - name: schedule
              mountPath: /etc/polytope/schedule.xml
              subPath: schedule.xml
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "polytope-server.fullname" . }}-config
        {{- if $authEnabled }}
        - name: config-runtime
          emptyDir: {}
        {{- end }}
        {{- if $authEnabled }}
        - name: auth-public-keys
          projected:
            sources:
              - secret:
                  name: {{ $publicKeySecret.name }}
                  items:
                    - key: {{ $publicKeySecret.key }}
                      path: public-key.pem
              {{- range $index, $key := (.Values.authentication).additionalPublicKeys }}
              - secret:
                  name: {{ required (printf "authentication.additionalPublicKeys[%d].secretName is required" $index) $key.secretName }}
                  items:
                    - key: {{ required (printf "authentication.additionalPublicKeys[%d].secretKey is required" $index) $key.secretKey }}
                      path: {{ printf "public-key-%d.pem" $index }}
              {{- end }}
        {{- end }}
        {{- if .Values.schedule }}
        - name: schedule
          emptyDir: {}
        - name: schedule-ssh
          secret:
            secretName: {{ .Values.schedule.sshSecretName }}
            defaultMode: 0400
        {{- end }}
