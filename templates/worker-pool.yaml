{{- range $name, $pool := .Values.workerPools }}
{{- $poolEnabled := eq (include "polytope-server.workerPoolEnabled" (dict "name" $name "pool" $pool)) "true" }}
{{- if $poolEnabled }}
{{- $cache := include "polytope-server.workerCache" (dict "name" $name "pool" $pool) | fromYaml }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "polytope-server.fullname" $ }}-worker-{{ $name }}
  labels:
    {{- include "polytope-server.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $pool.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "polytope-server.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      {{- $podAnnotations := mergeOverwrite (deepCopy ($.Values.podAnnotations | default dict)) ($pool.podAnnotations | default dict) }}
      annotations:
        {{- if or $pool.config $pool.marsConfig }}
        checksum/worker-config: {{ toYaml (dict "config" ($pool.config | default dict) "marsConfig" ($pool.marsConfig | default dict)) | sha256sum }}
        {{- end }}
        {{- with $podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "polytope-server.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        app: worker
    spec:
      {{- include "polytope-server.imagePullSecrets" $ | nindent 6 }}
      {{- if $pool.marsConfig }}
      serviceAccountName: {{ include "polytope-server.fullname" $ }}-mars-worker
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "polytope-server.image" (dict "imageRoot" $pool.image "global" $.Values.global) | quote }}
          imagePullPolicy: {{ $pool.image.pullPolicy | default "Always" }}
          {{- if $.Values.telemetry.workers.enabled }}
          ports:
            - name: metrics
              containerPort: {{ $.Values.telemetry.workers.port }}
              protocol: TCP
          {{- end }}
          args:
            - --broker-url
            - {{ include "polytope-server.workerBrokerUrl" (dict "root" $ "pool" $pool.pool) | quote }}
            {{- $workerDefaults := $.Values.worker | default dict }}
            {{- $pollTimeoutMs := 3000 }}
            {{- if hasKey $workerDefaults "pollTimeoutMs" }}
            {{- $pollTimeoutMs = get $workerDefaults "pollTimeoutMs" }}
            {{- end }}
            {{- if hasKey $pool "pollTimeoutMs" }}
            {{- $pollTimeoutMs = $pool.pollTimeoutMs }}
            {{- end }}
            - --poll-timeout-ms
            - {{ $pollTimeoutMs | quote }}
            {{- range $pool.args }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- $rustLog := $.Values.worker.rustLog | default "info" }}
            {{- if hasKey $pool "rustLog" }}
            {{- $rustLog = get $pool "rustLog" }}
            {{- end }}
            - name: RUST_LOG
              value: {{ $rustLog | quote }}
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POLYTOPE_ENV
              value: {{ $.Values.polytope.env | quote }}
            - name: POLYTOPE_WORKER_POOL
              value: {{ $name | quote }}
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if $pool.marsConfig }}
            - name: MARS_HOME
              value: /mars-home
            {{- end }}
            {{- with $pool.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $pool.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $pool.config $pool.marsConfig $cache.enabled }}
          volumeMounts:
            {{- if $pool.config }}
            - name: config
              mountPath: /etc/worker/config.yaml
              subPath: config.yaml
            {{- end }}
            {{- if $pool.marsConfig }}
            - name: mars-config
              mountPath: /mars-home/etc/mars-client
            {{- end }}
            {{- if $cache.enabled }}
            - name: cache
              mountPath: {{ $cache.mountPath | quote }}
            {{- end }}
          {{- end }}
      {{- if or $pool.config $pool.marsConfig $cache.enabled }}
      volumes:
        {{- if $pool.config }}
        - name: config
          configMap:
            name: {{ include "polytope-server.fullname" $ }}-worker-{{ $name }}-config
        {{- end }}
        {{- if $pool.marsConfig }}
        - name: mars-config
          configMap:
            name: {{ include "polytope-server.fullname" $ }}-worker-{{ $name }}-mars-config
        {{- end }}
        {{- if $cache.enabled }}
        - name: cache
          {{- if eq $cache.backend "hostPath" }}
          hostPath:
            path: {{ $cache.path | quote }}
            type: {{ $cache.type }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ $cache.sizeLimit | quote }}
          {{- end }}
        {{- end }}
      {{- end }}
{{- end }}{{/* if $poolEnabled */}}
{{- end }}{{/* range workerPools */}}
